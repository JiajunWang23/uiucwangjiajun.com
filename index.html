<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Jiajun Wang - software engineer focused on backend systems, cloud infrastructure, real-time data, and AI-powered tools."
    >
    <meta name="theme-color" content="#eef6ff">
    <link rel="canonical" href="https://uiucwangjiajun.com">
    <meta property="og:title" content="Jiajun Wang | Software Engineer">
    <meta property="og:description" content="Software engineer focused on backend systems, cloud infrastructure, real-time analytics, and AI-powered tools.">
    <meta property="og:url" content="https://uiucwangjiajun.com">
    <meta property="og:type" content="website">
    <title>Jiajun Wang | Software Engineer</title>
    <link rel="icon" type="image/jpeg" href="./assets/avatar.jpg">
    <link rel="stylesheet" href="./styles.css?v=20261015">
  </head>
  <body>
    <a class="skip-link" href="#top">Skip to content</a>

    <div class="page-shell">
      <div class="ambient ambient-left"></div>
      <div class="ambient ambient-right"></div>

      <header class="site-header">
        <a class="brand" href="#home">
          <img class="brand-mark" src="./assets/avatar.jpg" alt="">
          <span class="brand-text">Jiajun Wang</span>
        </a>

        <div class="site-header-actions">
          <nav class="site-nav" aria-label="Primary">
            <a href="#home" data-view-link="home" id="nav-home">Home</a>
            <a href="#experience" data-view-link="experience" id="nav-experience">Experience</a>
            <a href="#projects" data-view-link="projects" id="nav-projects">Projects</a>
            <a href="/blog" id="nav-blog">Blog</a>
            <a href="#contact" data-view-link="contact" id="nav-contact">Contact</a>
          </nav>
        </div>
      </header>

      <main id="top" class="view-stage">
        <!-- HOME -->
        <section class="view-panel is-active" data-view="home">
          <div class="home-overview">
            <div class="hero home-hero">
              <div class="hero-stage glass">
                <div class="portrait-shell">
                  <div class="portrait-ring">
                    <img id="hero-portrait-image" class="portrait-image" alt="Portrait of Jiajun Wang">
                    <div id="hero-portrait-fallback" class="portrait-fallback">JW</div>
                  </div>
                </div>

                <div class="intro-card">
                  <h1 id="hero-name"></h1>
                  <a class="hero-subtitle hero-subtitle-link" id="hero-subtitle"></a>
                  <p class="hero-location" id="hero-location"></p>
                  <div class="hero-industry-list" id="hero-industry-list"></div>
                  <div class="hero-link-row" id="hero-link-row"></div>
                </div>
              </div>
            </div>

            <div class="home-about">
              <h2 id="about-heading">About Me</h2>
              <div id="home-intro-content" class="home-about-prose section-tight"></div>
              <section class="education-section" aria-labelledby="education-heading">
                <h3 id="education-heading">Education</h3>
                <div class="education-list" id="education-list"></div>
              </section>
              <div id="home-about-content" class="home-about-prose section-tight"></div>
              <div class="tool-pills section-tight" id="home-skills" aria-label="Technical skills"></div>
            </div>
          </div>
        </section>

        <!-- EXPERIENCE -->
        <section class="view-panel" data-view="experience">
          <div class="section-heading experience-section-header">
            <div>
              <h2 id="experience-heading">Industry Experience</h2>
            </div>
          </div>
          <div class="project-section-intro">
            <p id="experience-intro"></p>
          </div>
          <div class="timeline section-tight" id="experience-list"></div>

          <div class="section-heading section-offset">
            <div>
              <h2 id="interests-heading">Technical Interests</h2>
            </div>
          </div>
          <div class="capability-grid section-tight" id="interests-grid"></div>
        </section>

        <!-- PROJECTS -->
        <section class="view-panel" data-view="projects">
          <div class="section-heading project-section-header">
            <div>
              <h2 id="projects-heading">Selected Projects</h2>
            </div>
          </div>
          <div class="project-section-intro">
            <p id="projects-intro"></p>
          </div>
          <div class="projects-nav section-tight" id="projects-nav"></div>
          <div class="projects-categories section-offset" id="projects-categories"></div>
        </section>

        <!-- CONTACT -->
        <section class="view-panel" data-view="contact">
          <div class="contact-section glass">
            <div class="contact-copy">
              <h2 id="contact-heading"></h2>
              <p class="section-copy" id="contact-copy"></p>
            </div>
            <div class="contact-actions">
              <div class="contact-booking-grid" id="contact-booking"></div>
              <div class="hero-link-row contact-link-row" id="contact-links"></div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>&copy; 2026 Jiajun Wang</span>
        <span id="footer-updated"></span>
      </footer>
    </div>

    <script src="./script.js?v=20261015"></script>
  </body>
</html>
